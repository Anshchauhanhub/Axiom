version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: axiom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_secret
      POSTGRES_DB: axiom_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
