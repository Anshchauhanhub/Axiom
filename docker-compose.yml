version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://user:password@db:5432/axiom
      # Add other ENVs here for local testing:
      # - TELEGRAM_BOT_TOKEN=...
      # - GROQ_API_KEY=...
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=axiom
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
